name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo test
        run: cargo test --workspace

  clippy:
    name: Clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings

  linux-artifact:
    name: Linux portable binary (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-artifact-ubuntu-22.04

      - name: Build glibc binary on Ubuntu 22.04
        run: cargo build --release -p chat-cli

      - name: Build self-contained musl binary
        env:
          CC: x86_64-linux-musl-gcc
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc
          CGO_ENABLED: "1"
        run: cargo build --release -p chat-cli --target x86_64-unknown-linux-musl

      - name: Package Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/chat-cli-x86_64-linux-gnu dist/chat-cli-x86_64-linux-musl
          cp target/release/chat-cli dist/chat-cli-x86_64-linux-gnu/chat-cli
          cp target/x86_64-unknown-linux-musl/release/chat-cli dist/chat-cli-x86_64-linux-musl/chat-cli
          tar -C dist -czf dist/chat-cli-x86_64-linux-gnu.tar.gz chat-cli-x86_64-linux-gnu
          tar -C dist -czf dist/chat-cli-x86_64-linux-musl.tar.gz chat-cli-x86_64-linux-musl
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: chat-cli-linux-binaries
          path: |
            dist/chat-cli-x86_64-linux-gnu.tar.gz
            dist/chat-cli-x86_64-linux-musl.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  macos-artifact:
    name: macOS binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-artifact-${{ matrix.arch }}

      - name: Build release binary
        run: cargo build --release -p chat-cli

      - name: Package macOS binary
        run: |
          set -euo pipefail
          mkdir -p dist/chat-cli-${{ matrix.arch }}-macos
          cp target/release/chat-cli dist/chat-cli-${{ matrix.arch }}-macos/chat-cli
          tar -C dist -czf dist/chat-cli-${{ matrix.arch }}-macos.tar.gz chat-cli-${{ matrix.arch }}-macos
          (cd dist && shasum -a 256 chat-cli-${{ matrix.arch }}-macos.tar.gz > SHA256SUMS)

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: chat-cli-macos-${{ matrix.arch }}
          path: |
            dist/chat-cli-${{ matrix.arch }}-macos.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  windows-artifact:
    name: Windows portable binary (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-artifact

      # The WhatsApp bridge is a cgo c-archive, which requires a GNU-compatible
      # toolchain on Windows; the runner's preinstalled mingw-w64 gcc is used by
      # both cgo and the x86_64-pc-windows-gnu Rust target.
      - name: Build release binary
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: cargo build --release -p chat-cli --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/chat-cli-x86_64-windows | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/chat-cli.exe dist/chat-cli-x86_64-windows/chat-cli.exe
          Compress-Archive -Path dist/chat-cli-x86_64-windows -DestinationPath dist/chat-cli-x86_64-windows.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/chat-cli-x86_64-windows.zip).Hash.ToLower()
          "$hash  chat-cli-x86_64-windows.zip" | Out-File -Encoding ascii dist/SHA256SUMS

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: chat-cli-windows-x86_64
          path: |
            dist/chat-cli-x86_64-windows.zip
            dist/SHA256SUMS
          if-no-files-found: error
