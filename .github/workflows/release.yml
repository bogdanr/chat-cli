name: Release

# Builds the prebuilt binaries and attaches them to a GitHub Release whenever a
# version tag is pushed. The asset names here MUST stay in sync with the
# `[package.metadata.binstall]` overrides in `crates/chat-cli/Cargo.toml`, since
# `cargo binstall chat-cli` downloads these exact files.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux binaries (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-ubuntu-22.04

      - name: Build glibc binary on Ubuntu 22.04
        run: cargo build --release -p chat-cli

      - name: Build self-contained musl binary
        env:
          CC: x86_64-linux-musl-gcc
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc
          CGO_ENABLED: "1"
        run: cargo build --release -p chat-cli --target x86_64-unknown-linux-musl

      - name: Package Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/chat-cli-x86_64-linux-gnu dist/chat-cli-x86_64-linux-musl
          cp target/release/chat-cli dist/chat-cli-x86_64-linux-gnu/chat-cli
          cp target/x86_64-unknown-linux-musl/release/chat-cli dist/chat-cli-x86_64-linux-musl/chat-cli
          tar -C dist -czf dist/chat-cli-x86_64-linux-gnu.tar.gz chat-cli-x86_64-linux-gnu
          tar -C dist -czf dist/chat-cli-x86_64-linux-musl.tar.gz chat-cli-x86_64-linux-musl
          (cd dist && sha256sum chat-cli-x86_64-linux-gnu.tar.gz chat-cli-x86_64-linux-musl.tar.gz > chat-cli-linux.sha256)

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chat-cli-x86_64-linux-gnu.tar.gz
            dist/chat-cli-x86_64-linux-musl.tar.gz
            dist/chat-cli-linux.sha256

  macos:
    name: macOS binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-${{ matrix.arch }}

      - name: Build release binary
        run: cargo build --release -p chat-cli

      - name: Package macOS binary
        run: |
          set -euo pipefail
          mkdir -p dist/chat-cli-${{ matrix.arch }}-macos
          cp target/release/chat-cli dist/chat-cli-${{ matrix.arch }}-macos/chat-cli
          tar -C dist -czf dist/chat-cli-${{ matrix.arch }}-macos.tar.gz chat-cli-${{ matrix.arch }}-macos
          (cd dist && shasum -a 256 chat-cli-${{ matrix.arch }}-macos.tar.gz > chat-cli-${{ matrix.arch }}-macos.sha256)

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chat-cli-${{ matrix.arch }}-macos.tar.gz
            dist/chat-cli-${{ matrix.arch }}-macos.sha256

  windows:
    name: Windows binary (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: crates/providers/whatsapp/go/go.sum

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      # The WhatsApp bridge is a cgo c-archive, which requires a GNU-compatible
      # toolchain on Windows; the runner's preinstalled mingw-w64 gcc is used by
      # both cgo and the x86_64-pc-windows-gnu Rust target.
      - name: Build release binary
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: cargo build --release -p chat-cli --target x86_64-pc-windows-gnu

      - name: Package Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/chat-cli-x86_64-windows | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/chat-cli.exe dist/chat-cli-x86_64-windows/chat-cli.exe
          Compress-Archive -Path dist/chat-cli-x86_64-windows -DestinationPath dist/chat-cli-x86_64-windows.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/chat-cli-x86_64-windows.zip).Hash.ToLower()
          "$hash  chat-cli-x86_64-windows.zip" | Out-File -Encoding ascii dist/chat-cli-x86_64-windows.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chat-cli-x86_64-windows.zip
            dist/chat-cli-x86_64-windows.sha256

  publish-crate:
    name: Publish crates.io stub (binstall metadata)
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set stub version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing chat-cli stub version $VERSION"
          # Replace the placeholder version line in the stub manifest.
          sed -i -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" \
            packaging/crates-io/Cargo.toml

      - name: Use project README for the crates.io page
        shell: bash
        # The crates.io page renders the package README. Publish the real
        # project README so the page works as a product/marketing surface
        # instead of showing the local stub note. (`readme = "README.md"` in
        # the stub manifest points at this copied file.)
        run: cp README.md packaging/crates-io/README.md

      - name: Publish to crates.io
        working-directory: packaging/crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty: the version line and README are edited in-place.
        # Idempotent: if publish fails because the version already exists (e.g.
        # published manually or by a re-run) confirm via the REST API and skip
        # gracefully rather than failing the release.  A User-Agent header is
        # required by crates.io; omitting it causes 403s that would mask the
        # real "already published" state and trigger a redundant publish attempt.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if cargo publish --allow-dirty; then
            echo "Successfully published chat-cli ${VERSION}."
          elif curl -fsS -A "cargo-publish-check/1.0" \
               "https://crates.io/api/v1/crates/chat-cli/${VERSION}" >/dev/null 2>&1; then
            echo "chat-cli ${VERSION} is already on crates.io; skipping."
          else
            echo "cargo publish failed and chat-cli ${VERSION} is not on crates.io." >&2
            exit 1
          fi
