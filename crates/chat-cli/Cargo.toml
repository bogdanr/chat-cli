[package]
name = "chat-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Your chats, in the terminal. A fast, keyboard-first TUI inbox for WhatsApp, Slack and ClickUp."

# NOTE: This crate is the real application and is NOT published to crates.io
# (it has path dependencies). The crates.io entry that powers `cargo binstall`
# is the lightweight stub in `packaging/crates-io/`, which carries the
# `[package.metadata.binstall]` configuration and is published automatically by
# `.github/workflows/release.yml` on every `v*` tag.

[dependencies]
anyhow.workspace = true
chat-core = { package = "core", path = "../core" }
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json = "1"
storage = { path = "../storage" }
tokio.workspace = true
toml.workspace = true
tui = { path = "../tui" }
clickup = { path = "../providers/clickup" }
slack = { path = "../providers/slack" }
whatsapp = { path = "../providers/whatsapp" }

[dev-dependencies]
tempfile.workspace = true
