[workspace]
resolver = "2"
members = [
    "crates/chat-cli",
    "crates/core",
    "crates/tui",
    "crates/storage",
    "crates/providers/whatsapp",
    "crates/providers/slack",
    "crates/mcp",
    "crates/notify",
]
# The crates.io publish stub shares the `chat-cli` package name and must not be
# part of the workspace build/test graph.
exclude = ["packaging/crates-io"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "GPL-3.0-only"
repository = "https://github.com/bogdanr/chat-cli"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
directories = "6"
flate2 = "1"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
notify-rust = "4"
open = "5"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.8"
rmcp = { version = "1.7", features = ["server", "macros"] }
rusqlite = { version = "0.34", features = ["bundled"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
slack-morphism = { version = "2.22", features = ["hyper", "socket-mode"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
emojis = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
qrcode = "0.14"
uuid = { version = "1", features = ["v4"] }
